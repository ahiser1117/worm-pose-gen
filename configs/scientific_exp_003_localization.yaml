experiment: EXP-003
preregistered_utc: 2026-08-19T19:03:47Z
hypothesis: >-
  Preserving an explicit spatial feature grid materially improves Tier-A
  localization relative to global intrinsic regression; the EXP-005 oracle
  result indicates that a fixed compact tangent representation is sufficient.

evidence_boundary:
  audited_holdout_allowed: false
  primary_annotations_are_evaluation_only: true
  annotation_manifest: experiments/scientific_exp_001_annotation/selection_manifest.json
  annotation_manifest_sha256: ba0a9ccc6f08844ecfcc52167271ba0cc13a47dafc8ba54bb2f25d1aec2619b3
  primary_annotation_snapshot: /temp_data4/alex/external_artifacts/annotations/worm_pose_tier_a_alex.json
  primary_annotation_snapshot_sha256: 99af7f0beadf81dab8bb4b6dbab0aa952a7d461116708e97f12b54dda5e9902b
  primary_trace_counts:
    complete: 17
    truncated: 12
    not_identifiable: 1
  exclude_from_training:
    exact_primary_frames: true
    temporal_radius_frames: 11
    manifest: experiments/scientific_exp_003_localization/proxy_exclusion_manifest.json
    manifest_sha256: 3eccdb08121a79f5aa4515d9eb67d57aea656a121ea023c653675edc52427854
    excluded_recording_frame_pairs: 636
    accepted_proxy_rows_excluded: 9
    reason: prevent_proxy_or_neighbor_leakage_into_the_common_Tier_A_evaluation
  delayed_repeats_may_not_be_viewed_or_used_for_model_selection: true

reference:
  rejected_global_checkpoint: artifacts/checkpoints/exp_0007_rejected_diagnostic.ckpt
  rejected_global_checkpoint_sha256: 7606c7fbb990fee59624f6882155dea250fecab8059988d69441254ff7bc13d0
  fixed_primary30_metrics: experiments/scientific_exp_002_primary30_baselines/metrics.json
  fixed_primary30_metrics_sha256: f4f61f29025f90d56def9361b81f3972159cbda019799a60873ecdf92480ec95
  diagnostic_complete_trace_median_point_px: 80.86883366319204
  role: frozen_negative_control_not_a_fair_budget_matched_architecture_comparison

input:
  initial_height: 192
  initial_width: 256
  body_points: 100
  later_resolution_ablation:
    - [192, 256]
    - [288, 384]
    - [384, 512]
  proxy_hdf5: /temp_data4/alex/external_artifacts/datasets/worm_pose_gen/proxy_v1/proxy_labels.h5
  proxy_sha256: 1f891a38c4175e5d6e38d776fbb73c96fe2e2a796e4aecfd386e6ab9da34a11c
  synthetic_train_profile: development
  synthetic_validation_profile: held_out
  preprocessing: unchanged_normalize_image

paired_architectures:
  - name: global_intrinsic_budget_matched
    role: causal_reference
    spatial_output: global_pool_4x4_then_flatten
    tangent_shape_coefficients: 16
  - name: dense_centerline_field
    role: localization_preserving_variant_B
    outputs:
      - centerline_probability_or_distance
      - tangent_sin_cos
      - endpoint_heatmap
      - image_support
    decoder_contract: smooth_ordered_100_point_curve_with_explicit_failure_score
  - name: anchored_intrinsic_grid
    role: localization_preserving_variant_C
    outputs_per_cell:
      - confidence
      - anchor_offset
      - global_orientation_sin_cos
      - body_length
      - 16_tangent_shape_coefficients
      - image_support
    inference_contract: best_single_cell_candidate
architecture_common_constraints:
  maximum_parameters: 2000000
  tangent_shape_coefficients: 16
  body_anchor_index: 50
  output_body_points: 100

training:
  fold: 2
  proxy_validation_recording: 2023-10-11-01
  model_seeds: [20260819, 20260820, 20260821]
  data_seed: 20260819
  maximum_steps: 1200
  maximum_epochs: 40
  checkpoint_every_steps: 300
  train_batch_size: 16
  evaluation_batch_size: 32
  precision: 32-true
  optimizer: AdamW
  learning_rate: 0.0003
  same_training_order_across_architectures: true
  same_proxy_synthetic_mixture_across_architectures: true
  primary_Tier_A_used_for_gradients: false
  accelerator: gpu
  devices: 1
  data_pipeline:
    materialize_before_training: true
    materialized_tensor_hash_required: true
    cpu_threads: 4
    dataloader_workers: 0
    pin_memory: true
    purpose: prevent_deterministic_renderer_and_HDF5_CPU_stalls_during_GPU_training

primary_metrics:
  complete_traces:
    - median_per_frame_point_distance_px
    - p95_all_body_positions_point_distance_px
    - mean_tangent_error_degrees
    - endpoint_error_px
    - body_length_error_fraction
    - error_by_body_position
  truncated_traces:
    - one_way_visible_trace_distance_px
    - visible_trace_axis_error_degrees
  all_frames:
    - explicit_failure_rate
    - cpu_and_gpu_throughput
  stratify_by:
    - recording
    - selection_stratum
    - trace_state
  uncertainty:
    bootstrap_unit: frame
    bootstrap_resamples: 2000
    report_all_three_seeds: true

decision:
  do_not_tune_thresholds_on_primary30: true
  first_gate: >-
    A localization-preserving variant must improve complete-trace median point
    error by at least 30 percent versus the paired global model without a worse
    explicit failure rate; report the interval and all seeds rather than treating
    the threshold alone as proof.
  resolution_ablation_authorized_only_for_best_spatial_variant: true
  expansion_trigger: >-
    If competing variants differ by less than the delayed-repeat scale or their
    frame-bootstrap intervals overlap substantially, collect 30 to 60 additional
    unique Tier-A frames before selecting a winner.
  no_refinement_until_median_proposal_error_px_at_most: 16

resources:
  maximum_minutes_per_run: 20
  maximum_primary_gpu_hours: 3
  maximum_repeat_gpu_hours: 6
  maximum_external_storage_gib: 6
  current_blocker: none_CUDA_verified_on_physical_GPU_0
